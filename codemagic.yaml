# Codemagic CI/CD — https://docs.codemagic.io/yaml/yaml-getting-started/
#
# This Mac runs Xcode 15.2 and cannot build for the App Store any more, so the
# iOS store build happens here. Android is built locally with
# `tool/build_release.sh`, which this workflow deliberately does not duplicate.
#
# Signing uses the Apple Developer Portal key registered in the Codemagic UI
# under Settings > Integrations > Developer Portal. `codemagic-admin` is the
# name that key carries there — it is account-wide, so it is shared with the
# other apps in this Codemagic account. Renaming it there breaks them; change
# the name below instead.
definitions:
  scripts:
    - &flutter_packages
      name: Get Flutter packages
      script: flutter pub get
    - &analyze_and_test
      name: Analyze and test
      script: |
        flutter analyze
        flutter test

workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-admin
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: |
          # google_mobile_ads 4.0.0 is CocoaPods-only, but the
          # webview_flutter_wkwebview it pulls in has adopted SPM, and recent
          # Flutter turns SPM on by default — `pod install` then refuses the
          # mix. The ads plugin is pinned to 4.x so the dev Mac's Xcode 15.2 can
          # still build (see EXTRAS.md), so turn SPM off rather than move the
          # pin. Revisit when that pin is lifted.
          flutter config --no-enable-swift-package-manager
      - *flutter_packages
      - *analyze_and_test
      # Signing is deliberately kept away from Flutter. `flutter build ipa`
      # insists on resolving a signing identity itself: with DEVELOPMENT_TEAM
      # in the project it archives with automatic signing and hunts for an iOS
      # App Development profile, and without it it goes looking for a
      # development certificate in the keychain. Neither is what an App Store
      # build needs, and this repo carries development signing so the app can
      # run on the dev Mac's iPhone. So build unsigned here, then let Xcode
      # archive and export with the profile fetched below.
      - name: Build the app unsigned
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=LIVE_ADS=true \
            --build-number=$PROJECT_BUILD_NUMBER
      - name: Set up code signing
        script: |
          # Runs after the build so Flutter's project migrations (deployment
          # target, UIScene lifecycle) cannot rewrite project.pbxproj over the
          # signing settings use-profiles writes into it.
          #
          # Nothing has ever built this bundle id for the App Store, so there is
          # no profile to fetch — --create makes one, and issues the
          # distribution certificate if the account has none.
          keychain initialize
          app-store-connect fetch-signing-files "com.arrowsgame.arrowsGame" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Archive and export the IPA
        script: |
          # Codemagic's own tool, not Flutter's: it archives and exports with
          # the manual App Store profile installed above and adds no signing
          # logic of its own. Pods are already installed by the unsigned build.
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
