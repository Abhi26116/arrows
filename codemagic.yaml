# Codemagic CI/CD — https://docs.codemagic.io/yaml/yaml-getting-started/
#
# This Mac runs Xcode 15.2 and cannot build for the App Store any more, so the
# iOS store build happens here. Android is built locally with
# `tool/build_release.sh`, which this workflow deliberately does not duplicate.
#
# Signing uses the Apple Developer Portal key registered in the Codemagic UI
# under Settings > Integrations > Developer Portal. `codemagic-admin` is the
# name that key carries there — it is account-wide, so it is shared with the
# other apps in this Codemagic account. Renaming it there breaks them; change
# the name below instead.
definitions:
  scripts:
    - &flutter_packages
      name: Get Flutter packages
      script: flutter pub get
    - &analyze_and_test
      name: Analyze and test
      script: |
        flutter analyze
        flutter test

workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-admin
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: |
          # google_mobile_ads 4.0.0 is CocoaPods-only, but the
          # webview_flutter_wkwebview it pulls in has adopted SPM, and recent
          # Flutter turns SPM on by default — `pod install` then refuses the
          # mix. The ads plugin is pinned to 4.x so the dev Mac's Xcode 15.2 can
          # still build (see EXTRAS.md), so turn SPM off rather than move the
          # pin. Revisit when that pin is lifted.
          flutter config --no-enable-swift-package-manager
      - *flutter_packages
      - *analyze_and_test
      - name: Set up code signing
        script: |
          # `ios_signing:` in the environment only *looks for* a profile that
          # already exists, and this Apple account has never produced one for
          # this bundle id — hence "No matching profiles found". Ask for it to
          # be created instead. --create also issues the distribution
          # certificate when the account has none.
          keychain initialize
          app-store-connect fetch-signing-files "com.arrowsgame.arrowsGame" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=LIVE_ADS=true \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
